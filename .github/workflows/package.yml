name: Package macOS app
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      cold_build:
        description: Measure cold compilation without restoring project build caches
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  package-macos:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 configs/check_swift_toolchain.py
      - name: Cache the locked SurfacePlugins checkout
        uses: actions/cache@v6.1.0
        with:
          path: build/dependencies
          key: dependencies-${{ hashFiles('configs/surface_plugins.lock.json') }}
      - run: python3 configs/setup_local_project.py
      - run: python3 configs/restore_git_mtimes.py
      - name: Identify the Swift toolchain for the build cache
        run: python3 -c "import hashlib, subprocess; v = subprocess.run(['swift', '--version'], capture_output=True); print('SWIFT_ID=' + hashlib.sha256(v.stdout + v.stderr).hexdigest()[:16])" >> "$GITHUB_ENV"
      - name: Restore the latest universal SwiftPM build
        id: build-cache
        if: github.event_name != 'workflow_dispatch' || inputs.cold_build != true
        uses: actions/cache/restore@v6.1.0
        with:
          path: build/swiftpm
          key: package-${{ runner.os }}-${{ env.SWIFT_ID }}-${{ github.sha }}
          restore-keys: package-${{ runner.os }}-${{ env.SWIFT_ID }}-
      - name: Compile universal native slices
        id: compile
        run: |
          swift build --build-path build/swiftpm/arm64 --configuration release --triple arm64-apple-macosx14.0 --product XTouchCompactApp
          swift build --build-path build/swiftpm/x86_64 --configuration release --triple x86_64-apple-macosx14.0 --product XTouchCompactApp
      - name: Save compiled universal cache even if later checks fail
        if: always() && steps.compile.outcome == 'success'
        uses: actions/cache/save@v6.1.0
        with:
          path: build/swiftpm
          key: package-${{ runner.os }}-${{ env.SWIFT_ID }}-${{ github.sha }}
      - name: Require a main commit for a pushed tag
        if: github.event_name == 'push'
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Build universal ad-hoc ZIP and DMG with provenance and final-payload checks
        run: python3 configs/macos_workflow.py package --architecture universal
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: xtouch-compact-universal
          path: build/package/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Report wall time and enforce warm-cache 300s budget
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORED_BUILD_KEY: ${{ steps.build-cache.outputs.cache-matched-key }}
        run: python3 configs/ci_job_budget.py --cache-key "$RESTORED_BUILD_KEY"
  package-smoke:
    needs: package-macos
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: xtouch-compact-universal
          path: build/package
      - name: Verify final ZIP and DMG with isolated GUI and headless startup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          from configs.macos_workflow import check_package
          assets = sorted(p for p in Path('build/package').iterdir() if p.suffix in {'.zip', '.dmg'})
          if len(assets) != 2:
              raise SystemExit('Expected exactly one universal ZIP and DMG')
          lock = json.loads(Path('configs/surface_plugins.lock.json').read_text())
          for asset in assets:
              check_package(asset, expected_commit=os.environ['GITHUB_SHA'],
                            expected_plugins_revision=lock['revision'], require_clean=True)
          PY
      - name: Report wall time and enforce warm-cache 300s budget
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CI_JOB_NAME: package-smoke (${{ matrix.os }})
          RESTORED_BUILD_KEY: ''
        run: python3 configs/ci_job_budget.py --cache-key "$RESTORED_BUILD_KEY"
