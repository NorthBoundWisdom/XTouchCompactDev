name: Package macOS app
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      cold_build:
        description: Measure cold compilation without restoring project build caches
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  compile-intel:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SLICE_ARCH: x86_64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 configs/check_swift_toolchain.py
      - name: Cache the locked SurfacePlugins checkout
        uses: actions/cache@v6.1.0
        with:
          path: build/dependencies
          key: dependencies-${{ hashFiles('configs/surface_plugins.lock.json') }}
      - run: python3 configs/setup_local_project.py
      - run: python3 configs/restore_git_mtimes.py
      - name: Identify the Swift toolchain for the build cache
        run: python3 -c "import hashlib, subprocess; v = subprocess.run(['swift', '--version'], capture_output=True); print('SWIFT_ID=' + hashlib.sha256(v.stdout + v.stderr).hexdigest()[:16])" >> "$GITHUB_ENV"
      - name: Restore the latest release slice build
        id: build-cache
        if: github.event_name != 'workflow_dispatch' || inputs.cold_build != true
        uses: actions/cache/restore@v6.1.0
        with:
          path: build/swiftpm/${{ env.SLICE_ARCH }}
          key: package-slice-${{ env.SLICE_ARCH }}-${{ env.SWIFT_ID }}-${{ github.sha }}
          restore-keys: package-slice-${{ env.SLICE_ARCH }}-${{ env.SWIFT_ID }}-
      - name: Compile native release slice
        id: compile
        run: swift build --build-path "build/swiftpm/$SLICE_ARCH" --configuration release --triple "$SLICE_ARCH-apple-macosx14.0" --product XTouchCompactApp
      - name: Save compiled release slice cache even if later checks fail
        if: always() && steps.compile.outcome == 'success'
        uses: actions/cache/save@v6.1.0
        with:
          path: build/swiftpm/${{ env.SLICE_ARCH }}
          key: package-slice-${{ env.SLICE_ARCH }}-${{ env.SWIFT_ID }}-${{ github.sha }}
      - name: Stage exact-commit slice with dependency and payload hashes
        run: python3 -c 'import os; from configs.macos_workflow import stage_release_slice; stage_release_slice(os.environ["SLICE_ARCH"])'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: xtouch-release-${{ env.SLICE_ARCH }}-attempt-${{ github.run_attempt }}
          path: build/native-slices/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
      - name: Report whole-run wall time and enforce 300s budget
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORED_BUILD_KEY: ${{ steps.build-cache.outputs.cache-matched-key }}
        run: python3 configs/ci_job_budget.py --cache-key "$RESTORED_BUILD_KEY"
  package-macos:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SLICE_ARCH: arm64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 configs/check_swift_toolchain.py
      - name: Cache the locked SurfacePlugins checkout
        uses: actions/cache@v6.1.0
        with:
          path: build/dependencies
          key: dependencies-${{ hashFiles('configs/surface_plugins.lock.json') }}
      - run: python3 configs/setup_local_project.py
      - run: python3 configs/restore_git_mtimes.py
      - name: Identify the Swift toolchain for the build cache
        run: python3 -c "import hashlib, subprocess; v = subprocess.run(['swift', '--version'], capture_output=True); print('SWIFT_ID=' + hashlib.sha256(v.stdout + v.stderr).hexdigest()[:16])" >> "$GITHUB_ENV"
      - name: Restore the latest release slice build
        id: build-cache
        if: github.event_name != 'workflow_dispatch' || inputs.cold_build != true
        uses: actions/cache/restore@v6.1.0
        with:
          path: build/swiftpm/${{ env.SLICE_ARCH }}
          key: package-slice-${{ env.SLICE_ARCH }}-${{ env.SWIFT_ID }}-${{ github.sha }}
          restore-keys: package-slice-${{ env.SLICE_ARCH }}-${{ env.SWIFT_ID }}-
      - name: Compile native release slice
        id: compile
        run: swift build --build-path "build/swiftpm/$SLICE_ARCH" --configuration release --triple "$SLICE_ARCH-apple-macosx14.0" --product XTouchCompactApp
      - name: Save compiled release slice cache even if later checks fail
        if: always() && steps.compile.outcome == 'success'
        uses: actions/cache/save@v6.1.0
        with:
          path: build/swiftpm/${{ env.SLICE_ARCH }}
          key: package-slice-${{ env.SLICE_ARCH }}-${{ env.SWIFT_ID }}-${{ github.sha }}
      - name: Stage exact-commit slice with dependency and payload hashes
        run: python3 -c 'import os; from configs.macos_workflow import stage_release_slice; stage_release_slice(os.environ["SLICE_ARCH"])'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: xtouch-release-${{ env.SLICE_ARCH }}-attempt-${{ github.run_attempt }}
          path: build/native-slices/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
      # ARM packages in its already-prepared runner. Both compile producers start first;
      # no early waiting consumer can occupy a runner ahead of a producer.
      - name: Wait for this run and attempt's Intel slice
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 configs/ci_artifact_wait.py --name "xtouch-release-x86_64-attempt-$GITHUB_RUN_ATTEMPT" --producer compile-intel
      - uses: actions/download-artifact@v8.0.2
        with:
          name: xtouch-release-x86_64-attempt-${{ github.run_attempt }}
          path: build/native-slices
      - name: Require a main commit for a pushed tag
        if: github.event_name == 'push'
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Merge verified slices and build ad-hoc ZIP and DMG with final-payload checks
        run: python3 configs/macos_workflow.py package --architecture universal --prebuilt-slices build/native-slices
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: xtouch-compact-universal-attempt-${{ github.run_attempt }}
          path: build/package/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Report whole-run wall time and enforce 300s budget
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORED_BUILD_KEY: ${{ steps.build-cache.outputs.cache-matched-key }}
        run: python3 configs/ci_job_budget.py --cache-key "$RESTORED_BUILD_KEY"
  package-smoke:
    needs: compile-intel
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The Intel slice is already built. Preparing consumers now cannot starve
      # compile producers, and overlaps ARM's final merge/DMG work.
      - name: Wait for this run and attempt's final package
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 configs/ci_artifact_wait.py --name "xtouch-compact-universal-attempt-$GITHUB_RUN_ATTEMPT" --producer package-macos
      - uses: actions/download-artifact@v8.0.2
        with:
          name: xtouch-compact-universal-attempt-${{ github.run_attempt }}
          path: build/package
      - name: Verify final ZIP and DMG with isolated GUI and headless startup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          from configs.macos_workflow import check_packages
          assets = sorted(p for p in Path('build/package').iterdir() if p.suffix in {'.zip', '.dmg'})
          if len(assets) != 2:
              raise SystemExit('Expected exactly one universal ZIP and DMG')
          lock = json.loads(Path('configs/surface_plugins.lock.json').read_text())
          check_packages(assets, expected_commit=os.environ['GITHUB_SHA'],
                         expected_plugins_revision=lock['revision'], require_clean=True)
          PY
      - name: Report whole-run wall time and enforce 300s budget
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CI_JOB_NAME: package-smoke (${{ matrix.os }})
          RESTORED_BUILD_KEY: ''
        run: python3 configs/ci_job_budget.py --cache-key "$RESTORED_BUILD_KEY"
