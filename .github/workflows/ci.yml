name: Swift core and macOS app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  core-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2'
      - run: swift test --jobs 2
  app-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build -c debug
      - run: swift test
