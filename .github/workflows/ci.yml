name: Swift core and macOS app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cold_build:
        description: Measure cold compilation without restoring project build caches
        required: false
        type: boolean
        default: false
      capture_previews:
        description: Run desktop-dependent preview capture (may time out on hosted runners)
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  core-linux:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    # Official Swift image retains the Ubuntu 24.04 / Swift 6.2 validation lane
    # without a third-party setup action that still declares the Node 20 runtime.
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Full history: every tracked file gets its last commit time.
          fetch-depth: 0
      - name: Trust the checked-out workspace in the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install workflow Python
        # Use GitHub's tool cache; Ubuntu APT DNS outages must not prevent tests.
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python3 --version
      - run: swift --version
      # SwiftPM rebuilds any input whose mtime changed. Commit times keep a restored build incremental:
      # files untouched since the cached build look unchanged, changed files rebuild.
      - run: python3 configs/restore_git_mtimes.py
      - name: Identify the Swift toolchain for the build cache
        run: python3 -c "import hashlib, subprocess; v = subprocess.run(['swift', '--version'], capture_output=True); print('SWIFT_ID=' + hashlib.sha256(v.stdout + v.stderr).hexdigest()[:16])" >> "$GITHUB_ENV"
      - name: Cache the locked SurfacePlugins checkout
        uses: actions/cache@v6.1.0
        with:
          path: build/dependencies
          key: dependencies-${{ hashFiles('configs/surface_plugins.lock.json', 'configs/control_surface_kit.lock.json') }}
      - name: Restore the latest SwiftPM build
        id: build-cache
        if: github.event_name != 'workflow_dispatch' || inputs.cold_build != true
        uses: actions/cache/restore@v6.1.0
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ env.SWIFT_ID }}-${{ github.sha }}
          restore-keys: swiftpm-${{ runner.os }}-${{ env.SWIFT_ID }}-
      - run: python3 configs/setup_local_project.py
      - run: python3 configs/check_host_layers.py
      - run: python3 -B configs/run_python_workflow_tests.py --suite workflow
      - name: Compile portable targets and tests
        id: compile
        run: swift build --build-tests
      - name: Save compiled portable cache even if later tests fail
        if: always() && steps.compile.outcome == 'success' && github.event_name == 'push'
        uses: actions/cache/save@v6.1.0
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ env.SWIFT_ID }}-${{ github.sha }}
      - run: swift test --skip-build
      - name: Build the standalone software simulator
        run: swift build --product XTouchSurfaceSimulator
      - name: Exercise real loopback simulator processes
        run: python3 -B configs/run_python_workflow_tests.py --suite simulator
      - name: Preserve Python per-case wall times
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: python-case-times-${{ github.job }}
          path: build/ci-verification/tests/python-*-case-times.json
          if-no-files-found: warn
      - name: Report whole-run wall time and enforce 300s budget
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORED_BUILD_KEY: ${{ steps.build-cache.outputs.cache-matched-key }}
        run: python3 configs/ci_job_budget.py --cache-key "$RESTORED_BUILD_KEY"
  app-macos:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Full history: every tracked file gets its last commit time.
          fetch-depth: 0
      - run: xcodebuild -version
      - run: python3 configs/check_swift_toolchain.py
      - run: brew install swiftformat ruff
      - run: python3 configs/format_repo.py --check
      # SwiftPM rebuilds any input whose mtime changed. Commit times keep a restored build incremental:
      # files untouched since the cached build look unchanged, changed files rebuild.
      - run: python3 configs/restore_git_mtimes.py
      - name: Identify the Swift toolchain for the build cache
        run: python3 -c "import hashlib, subprocess; v = subprocess.run(['swift', '--version'], capture_output=True); print('SWIFT_ID=' + hashlib.sha256(v.stdout + v.stderr).hexdigest()[:16])" >> "$GITHUB_ENV"
      - name: Cache the locked SurfacePlugins checkout
        uses: actions/cache@v6.1.0
        with:
          path: build/dependencies
          key: dependencies-${{ hashFiles('configs/surface_plugins.lock.json', 'configs/control_surface_kit.lock.json') }}
      - name: Restore the latest SwiftPM build
        id: build-cache
        if: github.event_name != 'workflow_dispatch' || inputs.cold_build != true
        uses: actions/cache/restore@v6.1.0
        with:
          path: build/swiftpm
          key: swiftpm-${{ runner.os }}-${{ env.SWIFT_ID }}-${{ github.sha }}
          restore-keys: swiftpm-${{ runner.os }}-${{ env.SWIFT_ID }}-
      - run: python3 configs/setup_local_project.py
      - run: python3 configs/check_host_layers.py
      - run: python3 -B configs/run_python_workflow_tests.py --suite workflow
      # One build path for tests, executables and the app, so nothing is compiled twice.
      - name: Compile native targets and tests
        id: compile
        run: swift build --build-path build/swiftpm --build-tests
      - name: Save compiled native cache even if later tests fail
        if: always() && steps.compile.outcome == 'success' && github.event_name == 'push'
        uses: actions/cache/save@v6.1.0
        with:
          path: build/swiftpm
          key: swiftpm-${{ runner.os }}-${{ env.SWIFT_ID }}-${{ github.sha }}
      - run: swift test --build-path build/swiftpm --skip-build
      - name: Link every executable in the test build path
        run: swift build --build-path build/swiftpm
      - name: Exercise hardware service with isolated fake MIDI only
        env:
          XTOUCH_HARDWARE_BINARY: build/swiftpm/debug/XTouchSurfaceHardware
        run: python3 -B configs/run_python_workflow_tests.py --suite simulator --pattern test_hardware_service.py
      - name: Exercise immutable no-device diagnostics over real HTTP
        env:
          XTOUCH_HARDWARE_BINARY: build/swiftpm/debug/XTouchSurfaceHardware
        run: python3 -B configs/run_python_workflow_tests.py --suite simulator --pattern test_hardware_offline_diagnostics.py
      - run: python3 configs/macos_workflow.py build
      - name: Isolated native startup
        run: |
          python3 - <<'PY'
          from configs.macos_workflow import REPO_ROOT, run, validate_smoke
          executable = REPO_ROOT / "build/app/debug/XTouchCompactApp.app/Contents/MacOS/XTouchCompactApp"
          output = run([executable, "--startup-smoke"], capture=True, timeout=30)
          validate_smoke(output)
          print(output)
          PY
      # Release ZIP/DMG packaging runs in package.yml (version tags and manual runs), not on every push.
      - name: Capture previews (manual desktop diagnostic)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_previews }}
        run: python3 tools/capture_readme_screenshots.py
      - name: Preserve preview diagnostics
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.capture_previews }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: isolated-preview-diagnostics
          path: build/screenshots/
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve Python per-case wall times
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: python-case-times-${{ github.job }}
          path: build/ci-verification/tests/python-*-case-times.json
          if-no-files-found: warn
      - name: Report whole-run wall time and enforce 300s budget
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORED_BUILD_KEY: ${{ steps.build-cache.outputs.cache-matched-key }}
        run: python3 configs/ci_job_budget.py --cache-key "$RESTORED_BUILD_KEY"
