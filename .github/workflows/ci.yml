name: Swift core and macOS app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      capture_previews:
        description: Run desktop-dependent preview capture (may time out on hosted runners)
        required: false
        type: boolean
        default: false
jobs:
  core-linux:
    runs-on: ubuntu-24.04
    # Official Swift image retains the Ubuntu 24.04 / Swift 6.2 validation lane
    # without a third-party setup action that still declares the Node 20 runtime.
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install workflow Python
        # Use GitHub's tool cache; Ubuntu APT DNS outages must not prevent tests.
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python3 --version
      - run: swift --version
      - run: python3 configs/setup_local_project.py
      - run: python3 -m unittest discover -s Tests/BuildWorkflowTests -v
      - run: swift test --jobs 2
  app-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - run: brew install swiftformat ruff
      - run: python3 configs/format_repo.py --check
      - run: swift --version
      - run: python3 configs/setup_local_project.py
      - run: python3 -m unittest discover -s Tests/BuildWorkflowTests -v
      - run: swift build -c debug
      - run: swift test --jobs 2
      - run: python3 configs/macos_workflow.py package
      - name: Capture previews (manual desktop diagnostic)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_previews }}
        run: python3 tools/capture_readme_screenshots.py
      - name: Preserve preview diagnostics
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.capture_previews }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: isolated-preview-diagnostics
          path: build/screenshots/
          if-no-files-found: warn
          retention-days: 7
  app-macos-modern:
    # Retain macos-15 / Swift 6.1 compatibility above; also exercise newer diagnostics.
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7.0.1
      - run: xcodebuild -version
      - run: python3 configs/check_swift_toolchain.py
      - run: python3 configs/setup_local_project.py
      - run: python3 -m unittest discover -s Tests/BuildWorkflowTests -v
      - run: swift build
      - run: swift test --jobs 2
      - run: python3 configs/macos_workflow.py build
      - name: Isolated modern-toolchain native startup
        run: |
          python3 - <<'PY'
          from configs.macos_workflow import REPO_ROOT, run, validate_smoke
          executable = REPO_ROOT / "build/app/debug/XTouchCompactApp.app/Contents/MacOS/XTouchCompactApp"
          output = run([executable, "--startup-smoke"], capture=True, timeout=30)
          validate_smoke(output)
          print(output)
          PY
